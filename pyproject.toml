[project]
name = "fish-audio-persona"
version = "0.1.0"
description = "Persona Voice: a chatbot that replies with a person's essence and speaks with expressive Fish Audio cues"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=2.33",
    "fish-audio-sdk>=1.3",
    "emoji>=2.16",
    "python-multipart>=0.0.32",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
# An application, not a library: don't build/install the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["frontend", "*.md"]
